<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Fahmi Aliyi</title>
    <style>
      :root {
        color-scheme: light dark;
        --color-bg: light-dark(#fcfcfc, #101010);
        --color-text-primary: light-dark(
          oklch(0.18 0.005 80),
          oklch(0.98 0.002 80)
        );
        --color-text-secondary: light-dark(
          oklch(0.42 0.005 80),
          oklch(0.78 0.005 80)
        );
        --color-border: light-dark(oklch(0.9 0.002 80), oklch(0.24 0.004 80));
        --color-surface-card: light-dark(#ffffff, #0b0b0b);
        --color-accent: light-dark(oklch(0.55 0.15 260), oklch(0.65 0.15 260));
        --color-selection-bg: light-dark(
          oklch(0.92 0.04 260),
          oklch(0.25 0.04 260)
        );
        --space-sm: 0.5rem;
        --space-md: 1rem;
        --space-lg: 1.5rem;
        --space-xl: 2rem;
        --space-2xl: 3rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-block-size: 100vh;
        place-items: center;
        margin: 0;
        padding: var(--space-lg);
        background: var(--color-bg);
        color: var(--color-text-primary);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 1.125rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      main {
        inline-size: min(100%, 42rem);
      }

      article {
        padding: clamp(var(--space-xl), 7vw, var(--space-2xl));
        border: 1px solid var(--color-border);
        border-radius: 12px;
        background: var(--color-surface-card);
      }

      .eyebrow {
        margin: 0 0 var(--space-sm);
        color: var(--color-text-secondary);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }

      p {
        max-inline-size: 35rem;
        margin: var(--space-md) 0 0;
        color: var(--color-text-secondary);
        text-wrap: pretty;
      }

      .home-link {
        display: inline-flex;
        align-items: center;
        min-block-size: 2.75rem;
        margin-top: var(--space-xl);
        padding: 0.5rem 0.875rem;
        border-radius: 6px;
        background: var(--color-text-primary);
        color: var(--color-bg);
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }

      .home-link:hover {
        opacity: 0.82;
      }

      .home-link:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 3px;
      }

      ::selection {
        background: var(--color-selection-bg);
        color: var(--color-text-primary);
      }

      @media (prefers-reduced-motion: no-preference) {
        article {
          animation: enter 0.5s cubic-bezier(0.2, 0, 0, 1) both;
        }

        @keyframes enter {
          from {
            opacity: 0;
            translate: 0 0.75rem;
          }
          to {
            opacity: 1;
            translate: 0;
          }
        }
      }

      @media (forced-colors: active) {
        .home-link {
          background: ButtonFace;
          color: ButtonText;
          border: 1px solid ButtonText;
        }

        .home-link:focus-visible {
          outline-color: Highlight;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article aria-labelledby="page-title">
        <p class="eyebrow">Error 404</p>
        <h1 id="page-title">This page is not here.</h1>
        <p>
          The link may be outdated or the page may have moved. Return to my
          portfolio to find your way back.
        </p>
        <a class="home-link" href="/">Back to the portfolio</a>
      </article>
    </main>
  </body>
</html>
